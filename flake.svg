<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" style="background-color:lightgray" >
    <defs>
        <!-- Snowflake 1 - Wide with thin branches -->
        <polyline id="hex1" points="0 0, 50 15, 48 18, 52 35, 50 38, 54 55, 52 58, 56 75, 54 78, 58 92, 40 88, 28 70, 18 50, 10 28, 0 0" >
            <animate attributeName="stroke-width" values="0;5;0" dur="10s" repeatCount="indefinite" />
            <animate attributeName="fill-opacity" values="0.8;0.9;0.8" dur="7s" repeatCount="indefinite" />
        </polyline>
        
        <!-- Snowflake 2 - Fat middle tapering -->
        <polyline id="hex2" points="0 0, 25 15, 40 25, 50 35, 55 48, 52 62, 45 75, 35 82, 22 78, 12 60, 6 38, 3 18, 0 0" >
            <animate attributeName="stroke-width" values="0;5;0" dur="10s" repeatCount="indefinite" />
            <animate attributeName="fill-opacity" values="0.8;0.9;0.8" dur="7s" repeatCount="indefinite" />
        </polyline>
        
        <!-- Snowflake 3 - Sectored with deep indentations -->
        <polyline id="hex3" points="0 0, 28 10, 18 12, 42 18, 28 22, 58 30, 40 35, 72 44, 52 48, 88 60, 60 65, 80 75, 45 70, 30 55, 18 35, 10 18, 4 8, 0 0" >
            <animate attributeName="stroke-width" values="0;5;0" dur="10s" repeatCount="indefinite" />
            <animate attributeName="fill-opacity" values="0.8;0.9;0.8" dur="7s" repeatCount="indefinite" />
        </polyline>
        
        <!-- Snowflake 4 - Bold Hexagon -->
        <polyline id="hex4" points="0 0, 45 20, 45 60, 30 80, 10 70, 0 0" >
            <animate attributeName="stroke-width" values="0;5;0" dur="10s" repeatCount="indefinite" />
            <animate attributeName="fill-opacity" values="0.8;0.9;0.8" dur="7s" repeatCount="indefinite" />
        </polyline>
        
        <!-- Snowflake 5 - Massive wide with thin reach -->
        <polyline id="hex5" points="0 0, 65 10, 63 12, 68 28, 66 30, 70 48, 68 50, 73 68, 71 70, 75 88, 55 85, 38 68, 24 48, 12 26, 0 0" >
            <animate attributeName="stroke-width" values="0;5;0" dur="10s" repeatCount="indefinite" />
            <animate attributeName="fill-opacity" values="0.8;0.9;0.8" dur="7s" repeatCount="indefinite" />
        </polyline>
        
        <!-- Snowflake 6 - Bulky middle -->
        <polyline id="hex6" points="0 0, 30 18, 48 28, 58 38, 62 52, 58 68, 48 78, 32 82, 18 75, 8 55, 4 32, 0 0" >
            <animate attributeName="stroke-width" values="0;5;0" dur="10s" repeatCount="indefinite" />
            <animate attributeName="fill-opacity" values="0.8;0.9;0.8" dur="7s" repeatCount="indefinite" />
        </polyline>
        
        <!-- Snowflake 7 - Thick Bold Wedge -->
        <polyline id="hex7" points="0 0, 55 25, 55 55, 40 75, 20 65, 0 0" >
            <animate attributeName="stroke-width" values="0;5;0" dur="10s" repeatCount="indefinite" />
            <animate attributeName="fill-opacity" values="0.8;0.9;0.8" dur="7s" repeatCount="indefinite" />
        </polyline>
        
        <!-- Snowflake 8 - Thick middle taper -->
        <polyline id="hex8" points="0 0, 28 12, 45 22, 56 32, 62 45, 64 58, 60 72, 52 82, 38 86, 26 80, 16 65, 10 48, 6 28, 2 12, 0 0" >
            <animate attributeName="stroke-width" values="0;5;0" dur="10s" repeatCount="indefinite" />
            <animate attributeName="fill-opacity" values="0.8;0.9;0.8" dur="7s" repeatCount="indefinite" />
        </polyline>
        
        <g id="single">
            <use href="#hex8" transform="translate(100,100) scale(0.7)" />
        </g>
        <g id="third">
            <use href="#single" />
            <use href="#single" transform="matrix(-1,0,0,1,200,0)"  />
        </g>
        
        <g id="flake">
            <animateTransform attributeName="transform"
                attributeType="XML"
                type="rotate"
                from="0 100 100"
                to="360 100 100"
                dur="20s"
                repeatCount="indefinite"/>                         
                 
            <use href="#third" /> 
            <use href="#third" transform="rotate(120,100,100)" />
            <use href="#third" transform="rotate(240,100,100)" />        
        </g>
    </defs>
    <style>
        polyline{
            fill: #FFFFFF;
            stroke:white;
            stroke-width:0px;
        }
        polyline:hover{
            fill: red;
        }
    </style>
    <use href="#flake"  />                        
</svg>